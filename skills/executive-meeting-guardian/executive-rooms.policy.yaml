policy:
  id: executive-room-readiness
  version: "1.3"
  owner: collaboration-operations

org:
  name: Canada Collab SE Demo
  # Only these people can accept or decline self-heal proposals and use the control panel.
  admins:
    - rajithak@canadacollab.ca
    - rkanthet@cisco.com
  webex_space: Executive Meeting Guardian

# No static room list: the Cloud Control workflows pick the device at run time
# from the live Control Hub device list.
readiness:
  require_device_online: true
  require_applicable_join_method: true
  require_end_to_end_join_test: false
  target_audio_volume: 55
  approved_audio_volume_range:
    min: 45
    max: 65

  mandatory_checks:
    - device_connectivity
    - audio_policy
    - meeting_join_configuration

  advisory_checks:
    - peripherals
    - configuration_baseline
    - diagnostics
    - active_call

  # Known room configuration. Values are compared as strings. The self-heal
  # rules below restore these values, so the older "Desk Pro G2 self-heal"
  # schedule is disabled to keep a single automation in charge.
  configuration_baseline:
    Audio.DefaultVolume: "50"
    Conference.AutoAnswer.Mode: "Off"
    Standby.Control: "On"

  webex:
    join_methods:
      - key: Conference.DefaultCall.Protocol
        accepted: ["Spark", "Sip", "Auto"]

  microsoft_teams:
    # Each method is evidence that the room *can* join Teams. None of them
    # proves that a specific meeting will connect.
    join_methods:
      - id: teams_webrtc
        label: Microsoft Teams WebRTC
        # RoomOS exposes only the compatibility toggle; Teams WebRTC itself is
        # enabled at the organization level in Control Hub. Presence of this key
        # shows the firmware supports Teams WebRTC, nothing more.
        key: WebRTC.Provider.MicrosoftTeams.CompatibilityMode
        accepted: ["Off", "On"]
      - id: teams_cvi
        label: Cloud Video Interop (SIP)
        key: Conference.DefaultCall.Protocol
        accepted: ["Spark", "Sip", "Auto"]
    # Teams gate: a separately verified join test is required before the
    # room is declared ready for Teams.
    require_verified_join_test: true
    join_test_max_age_hours: 24
    require_obtp_calendar: false

remediation:
  prohibit_during_active_call: true
  require_approval_for_writes: true
  approval_max_age_minutes: 30

  permitted_actions:
    - set_demo_audio_volume

  prohibited_actions:
    - reboot_device
    - factory_reset
    - erase_configuration

self_heal:
  enabled: true
  # Self-heal starts when a device's Control Hub status changes from
  # "connected" to "connected with issues" or "disconnected". No macro is
  # needed: a Control Hub status watch reads every device in the org every
  # 20 seconds (Control Hub shows a change 40 s to 2.5 min after it happens),
  # then reads the device's diagnostics through the cloud xAPI.
  trigger:
    on_status_change_to: [connected_with_issues, disconnected]
    sources: [control_hub_status]
    control_hub_poll_seconds: 20
    # Device types watched. Peripherals (navigators, cameras, microphones,
    # monitors) follow their room device and appear in its error codes.
    device_types: [roomdesk, phone]
    # Informational diagnostics that do not make Control Hub show "connected with issues".
    ignore_diagnostics: [MacrosRuntimeActive]
  approval:
    # Proposal card in the Webex space with Accept / Decline buttons.
    auto_accept_after_seconds: 5
    # Declined issues are never proposed or healed again until an admin
    # presses "Reset declined" in the control panel.
    on_decline: suppress
  never_during_active_call: true
  # Devices are handled one at a time; the lock expires on its own if a run fails.
  lock_seconds: 120
  verify_after_seconds: 6
  rules:
    - id: ultrasound_disabled
      title: Ultrasound pairing disabled
      when: {diagnostic: UltrasoundConfigSettings}
      heal: {configuration: {Audio.Ultrasound.MaxVolume: 70}}
    - id: internal_speaker_disabled
      title: Internal speaker disabled
      when: {diagnostic: AudioInternalSpeakerDisabled}
      heal: {configuration: {Audio.Output.InternalSpeaker.Mode: "On"}}
  # Warning, error and critical diagnostics without a rule are reported in the
  # space and opened as a ServiceNow incident; nothing is changed on the device.
  unhandled_diagnostics: notify_and_incident
  # An issue with no automatic fix is reported once per device, then stays
  # quiet for this long even if Control Hub keeps flipping the status.
  renotify_minutes: 240
  # A disconnected room cannot be healed remotely: it is reported in the space
  # and opened as a ServiceNow incident, and a note is added when it returns.
  on_disconnect: notify_and_incident
  incident_when_not_verified: true

verification:
  require_fresh_device_status: true
  require_post_change_readback: true
  fail_on_unknown_result: true
  readback_attempts: 5
  readback_interval_seconds: 2

incidents:
  provider: servicenow
  create_on: [BLOCKED, ATTENTION REQUIRED]
  category: Collaboration
  subcategory: Meeting Room
  assignment_group: Collaboration Operations
  # executive rooms get urgency 1 / impact 2 (priority 2 in the default matrix)
  urgency: "1"
  impact: "2"
  add_verification_note: true
  resolve_on_verified_recovery: false

reporting:
  show_customer_policy_version: true
  show_evidence_sources: true
  show_unknown_checks: true
