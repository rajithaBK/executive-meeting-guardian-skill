openapi: 3.0.3
info:
  title: ServiceNow Incidents (Executive Meeting Guardian)
  version: 1.0.0
  description: >
    Narrow access to the ServiceNow Table API for meeting-room incidents:
    find an open incident by failure signature, open an incident, and add a
    work note. No delete, no close, no access to other tables.
servers:
  - url: https://dev464128.service-now.com
security:
  - basicAuth: []
paths:
  /api/now/table/incident:
    get:
      operationId: findIncidents
      summary: Find incidents, for example the open incident for a room failure signature
      description: >
        Use sysparm_query to filter. To find the open incident for a failure
        signature use `correlation_id=<signature>^active=true`. To list a
        room's recent incidents use `short_descriptionLIKE<room name>^ORDERBYDESCsys_created_on`.
      parameters:
        - name: sysparm_query
          in: query
          required: true
          schema:
            type: string
          example: correlation_id=emg-toronto-executive-room-1a2b3c4d5e6f7a8b^active=true
        - name: sysparm_fields
          in: query
          schema:
            type: string
            default: sys_id,number,short_description,state,urgency,impact,correlation_id,assignment_group,sys_created_on
        - name: sysparm_limit
          in: query
          schema:
            type: integer
            default: 5
            maximum: 20
        - name: sysparm_display_value
          in: query
          schema:
            type: string
            enum: ["true", "false", "all"]
            default: "true"
      responses:
        "200":
          description: Matching incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
    post:
      operationId: createIncident
      summary: Open a ServiceNow incident for a meeting room
      description: >
        Call findIncidents first with the same correlation_id; only create an
        incident when no active one exists for that signature.
      parameters:
        - name: sysparm_fields
          in: query
          schema:
            type: string
            default: sys_id,number,short_description,state,correlation_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewIncident"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResult"
  /api/now/table/incident/{sys_id}:
    patch:
      operationId: addIncidentWorkNote
      summary: Add a work note to an existing incident
      parameters:
        - name: sys_id
          in: path
          required: true
          schema:
            type: string
        - name: sysparm_fields
          in: query
          schema:
            type: string
            default: sys_id,number,state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_notes]
              additionalProperties: false
              properties:
                work_notes:
                  type: string
                  description: Evidence and findings to append. Never include credentials or tokens.
      responses:
        "200":
          description: Work note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResult"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    NewIncident:
      type: object
      required: [short_description, description, correlation_id]
      additionalProperties: false
      properties:
        short_description:
          type: string
          maxLength: 160
          example: "Toronto Executive Room: ATTENTION REQUIRED - Audio volume"
        description:
          type: string
          description: Verified observations, evidence gaps and the recommended action.
        correlation_id:
          type: string
          description: Failure signature, emg-<room id>-<first 16 hex chars of SHA-256 of the sorted failing check keys joined with '|'>.
        urgency:
          type: string
          enum: ["1", "2", "3"]
          default: "2"
        impact:
          type: string
          enum: ["1", "2", "3"]
          default: "2"
        category:
          type: string
          default: hardware
        assignment_group:
          type: string
          default: Collaboration Operations
        caller_id:
          type: string
          default: emg.integration
    IncidentResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Incident"
    IncidentList:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
    Incident:
      type: object
      properties:
        sys_id:
          type: string
        number:
          type: string
        short_description:
          type: string
        state:
          type: string
        urgency:
          type: string
        impact:
          type: string
        correlation_id:
          type: string
        sys_created_on:
          type: string
