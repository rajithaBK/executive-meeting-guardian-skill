openapi: 3.0.3
info:
  title: Guardian Learning (GitHub)
  version: 1.0.0
  description: 'Lets AI Canvas learn from Executive Meeting Guardian self-heal history and propose org-rule changes as GitHub pull requests. Reads: two fixed GraphQL queries (current rules + open PRs, full
    event history). Writes: only skills/executive-meeting-guardian-org-rules/org-rules.json, only on a guardian/ branch, only by opening a pull request into main. There is no merge, delete or force-push
    operation: a human merges.'
servers:
- url: https://api.github.com
security:
- bearerAuth: []
paths:
  /graphql:
    post:
      operationId: readGuardianData
      summary: Read the current org rules (with main commit, tree and open PRs) or the full self-heal history
      description: Send exactly one of the two allowed queries. RULES returns main.oid (parent commit), main.tree.oid (base tree), rules.text (current org-rules.json) and open pull requests. HISTORY returns
        every event file under events/<day>/ with its JSON text; file names are <UTC ts>__<room>__<issue>__<decision>__<outcome>.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              additionalProperties: false
              properties:
                query:
                  type: string
                  enum:
                  - 'query { repository(owner: "rajithaBK", name: "executive-meeting-guardian-skill") { main: object(expression: "main") { ... on Commit { oid tree { oid } } } rules: object(expression:
                    "main:skills/executive-meeting-guardian-org-rules/org-rules.json") { ... on Blob { oid text } } pullRequests(states: OPEN, first: 10) { nodes { number title url headRefName createdAt
                    } } } }'
                  - 'query { repository(owner: "rajithaBK", name: "emg-guardian-history") { events: object(expression: "main:events") { ... on Tree { entries { name object { ... on Tree { entries { name
                    object { ... on Blob { text } } } } } } } } } }'
                  description: 'First value: RULES query. Second value: HISTORY query.'
      responses:
        '200':
          description: GraphQL result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
  /repos/rajithaBK/executive-meeting-guardian-skill/git/trees:
    post:
      operationId: createRulesTree
      summary: Stage a new version of org-rules.json on top of main's tree
      description: base_tree is main.tree.oid from readGuardianData RULES. content is the complete new org-rules.json (valid JSON, 2-space indent, trailing newline).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - base_tree
              - tree
              additionalProperties: false
              properties:
                base_tree:
                  type: string
                tree:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                    - path
                    - mode
                    - type
                    - content
                    additionalProperties: false
                    properties:
                      path:
                        type: string
                        enum:
                        - skills/executive-meeting-guardian-org-rules/org-rules.json
                      mode:
                        type: string
                        enum:
                        - '100644'
                      type:
                        type: string
                        enum:
                        - blob
                      content:
                        type: string
      responses:
        '201':
          description: Tree created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha:
                    type: string
  /repos/rajithaBK/executive-meeting-guardian-skill/git/commits:
    post:
      operationId: createRulesCommit
      summary: Commit the staged rules tree with main as parent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              - tree
              - parents
              additionalProperties: false
              properties:
                message:
                  type: string
                  description: Imperative summary, e.g. 'Widen executive volume range to 45-72'
                tree:
                  type: string
                  description: sha from createRulesTree
                parents:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                  description: '[main.oid] from readGuardianData RULES'
      responses:
        '201':
          description: Commit created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha:
                    type: string
                  html_url:
                    type: string
  /repos/rajithaBK/executive-meeting-guardian-skill/git/refs:
    post:
      operationId: createProposalBranch
      summary: Create a guardian/ branch pointing at the new commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ref
              - sha
              additionalProperties: false
              properties:
                ref:
                  type: string
                  pattern: ^refs/heads/guardian/[a-z0-9-]{3,60}$
                  description: refs/heads/guardian/<yyyymmdd>-<short-slug>
                sha:
                  type: string
                  description: sha from createRulesCommit
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref:
                    type: string
  /repos/rajithaBK/executive-meeting-guardian-skill/pulls:
    post:
      operationId: openRulesPullRequest
      summary: Open a pull request proposing the rules change for human review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - head
              - base
              - body
              additionalProperties: false
              properties:
                title:
                  type: string
                  maxLength: 120
                head:
                  type: string
                  pattern: ^guardian/[a-z0-9-]{3,60}$
                base:
                  type: string
                  enum:
                  - main
                body:
                  type: string
                  description: 'Markdown: evidence, change, expected effect, risk, rollback'
      responses:
        '201':
          description: Pull request opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: integer
                  html_url:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
